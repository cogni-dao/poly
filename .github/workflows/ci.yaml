name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  NODE_VERSION: "24"
  NODE_ENV: test
  LITELLM_MASTER_KEY: build-key
  AUTH_SECRET: tNf5lFM9yMhdgwS5yeQB8Y2kmigblBqobkvI2XN2brg=
  SCHEDULER_API_TOKEN: test-scheduler-api-token-for-ci-min32chars
  BILLING_INGEST_TOKEN: test-billing-ingest-token-for-ci-min32ch
  DISCORD_BOT_TOKEN: test-discord-bot-token-for-ci
  POSTHOG_API_KEY: phc_test_key_for_ci
  POSTHOG_HOST: http://localhost:18000

# story.0052: the CI logic is one composite action in cogni-dao/node-template, pinned below by full
# commit SHA; this file keeps only the node's triggers, env and thin lane callers. The job names ARE
# the required status contexts (.cogni/repo-policy.json): a job that runs the action keeps its bare
# name, which a reusable workflow call would not (it reports `<caller> / <job>`).
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          # The classifier diffs a PR against its base, so it needs the merge base history.
          fetch-depth: 0

      - uses: cogni-dao/node-template/.github/actions/node-ci@88ae150e447016f1e0e5ae28cc470ac500e5aa87
        with:
          lane: static
          node_version: ${{ env.NODE_VERSION }}

      - name: Reject retired operations bearer tokens
        run: bash scripts/ci/tests/no-legacy-ops-token.test.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          # The classifier diffs a PR against its base, so it needs the merge base history.
          fetch-depth: 0

      - uses: cogni-dao/node-template/.github/actions/node-ci@904e63d569ebb864f16dffd4b57fd6c406d55e00
        with:
          lane: unit
          node_version: ${{ env.NODE_VERSION }}

  component:
    runs-on: ubuntu-latest
    env:
      # Route Docker Hub image substitution through Google's trusted mirror
      # to avoid anonymous Hub quota failures on merge-queue runners.
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          # The classifier diffs a PR against its base, so it needs the merge base history.
          fetch-depth: 0

      - name: Preload Doltgres 0.57.3 from trusted mirror
        run: |
          docker pull mirror.gcr.io/dolthub/doltgresql:0.57.3
          docker tag mirror.gcr.io/dolthub/doltgresql:0.57.3 dolthub/doltgresql:0.57.3

      - uses: cogni-dao/node-template/.github/actions/node-ci@904e63d569ebb864f16dffd4b57fd6c406d55e00
        with:
          lane: component
          node_version: ${{ env.NODE_VERSION }}
          doltgres_command: pnpm --filter @cogni/node-template-app test:doltgres
