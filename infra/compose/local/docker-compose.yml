# Local-only Postgres for the Poly live-development loop.
# `scripts/local-runtime.mjs` supplies a workspace-scoped Compose project name,
# loopback port, database name, roles, and generated passwords. The named volume
# deliberately survives app restarts so encrypted CLOB credentials remain usable.
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LOCAL_DB_PORT:?LOCAL_DB_PORT is required}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_ROOT_PASSWORD:?LOCAL_POSTGRES_ROOT_PASSWORD is required}
      POSTGRES_DB: postgres
      POSTGRES_ROOT_USER: postgres
      POSTGRES_ROOT_PASSWORD: ${LOCAL_POSTGRES_ROOT_PASSWORD}
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      COGNI_NODE_DBS: ${LOCAL_DB_NAME:?LOCAL_DB_NAME is required}
      APP_DB_PASSWORD: ${LOCAL_APP_DB_PASSWORD:?LOCAL_APP_DB_PASSWORD is required}
      APP_DB_SERVICE_PASSWORD: ${LOCAL_SERVICE_DB_PASSWORD:?LOCAL_SERVICE_DB_PASSWORD is required}
      LITELLM_DB_NAME: ${LOCAL_LITELLM_DB_NAME:?LOCAL_LITELLM_DB_NAME is required}
      LOCAL_DB_NAME: ${LOCAL_DB_NAME}
      LOCAL_APP_DB_USER: ${LOCAL_APP_DB_USER:?LOCAL_APP_DB_USER is required}
      LOCAL_SERVICE_DB_USER: ${LOCAL_SERVICE_DB_USER:?LOCAL_SERVICE_DB_USER is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../runtime/postgres-init/provision.sh:/opt/cogni/provision.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
