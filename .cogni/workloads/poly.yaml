# Workload manifest (hub `workload-manifest`, story.5137): this node's app on the operator's
# node-deploy verb. `POST /api/v1/deploy/workloads {nodeId, env, workload: "poly", sourceSha}`
# reads this file at sourceSha. Image "." = the image this repo's CI built at that sha.
# Runtime env and secrets come from the operator (OpenBao custody), never from this file.
# Each merge to main ships through that one verb (story.5127): build once, blue/green, exact SHA.
apiVersion: score.dev/v1b1
metadata:
  # The workload is named for the node: the actuator binds poly's dedicated database cell to the
  # release whose workload equals the node slug (akash-tx-actuator requireQualifiedCellRelease).
  name: poly
  annotations:
    cogni.dev/exclusive: "false"
    cogni.dev/ephemeral-storage: 4Gi
    # story.5141: Poly owns its placement. Polymarket-allowed countries only
    # (https://docs.polymarket.com/api-reference/geoblock). Read by the operator at this source SHA.
    cogni.dev/placement-countries-production: "BG,CZ,FI,NL,PT,UA"
    cogni.dev/placement-countries-candidate-a: "FI,NL,PT,UA"
containers:
  app:
    image: .
    resources:
      requests:
        cpu: "2"
        # story.5142: 2 GiB drew no Polymarket-allowed bid (0 of 5 probe auctions, 2026-11-07); with
        # more than 2 GiB the BG digitalfrontier provider bid every time (8 of 8).
        memory: 4096Mi
    readinessProbe:
      httpGet:
        path: /readyz
        port: 3200
service:
  ports:
    web:
      port: 80
      targetPort: 3200
resources:
  web:
    type: route
    params:
      host: poly.cognidao.org
      path: /
      port: 80
