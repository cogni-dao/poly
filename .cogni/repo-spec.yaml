# Node Template — repo-spec
#
# Identity for the hub's node-template deployment; node_id MUST match
# infra/catalog/node-template.yaml. Forks renaming this scaffold MUST
# regenerate both UUIDs:
#   node_id:  openssl rand -hex 16 | sed 's/\(.\{8\}\)\(.\{4\}\)\(.\{4\}\)\(.\{4\}\)\(.\{12\}\)/\1-\2-\3-\4-\5/'
#   scope_id: uuidv5(node_id, "default")
# See docs/spec/identity-model.md, docs/spec/multi-node-tenancy.md.

schema_version: "0.1.4"

node_id: "4b06359a-a859-4399-888e-a8c7a6696f7e"
scope_id: "8ed85c91-0cf9-5c3c-b56b-19431d36815a"
scope_key: "default"

intent:
  name: poly
  hook: "Community AI for prediction markets"
  mission: "Cogni Poly is a community-built AI for prediction market research, monitoring cross-platform catalysts and surfacing explainable signals while token holders steer priorities."
  brand:
    icon: Crosshair
    color: "#22c55e"

governance:
  dao_contract: "0x8a018d191f7135dbf1adc5fa5a76e46cf02cc69c"
  plugin_contract: "0xfa4e08aed196f64a4bd66c82616c956c42c6d160"
  signal_contract: "0x99ae96f6f04b0276571d5a6df24021585477797f"
  chain_id: "8453"
  base_url: "https://proposal.cognidao.org"

cogni_dao:
  dao_contract: "0x8a018d191f7135dbf1adc5fa5a76e46cf02cc69c"
  plugin_contract: "0xfa4e08aed196f64a4bd66c82616c956c42c6d160"
  signal_contract: "0x99ae96f6f04b0276571d5a6df24021585477797f"
  chain_id: "8453"
  base_url: "https://proposal.cognidao.org"

# Activity ledger ingestion + approver allowlist.
# `approvers` gates the `(admin)/` route group and write routes under
# `/api/v1/attribution/*`. Replace with the fork's DAO-owner wallet(s) when
# spinning up a new node from this template.
activity_ledger:
  epoch_length_days: 7
  approvers:
    - "0x070075F1389Ae1182aBac722B36CA12285d0c949" # derekg1729.eth (template default)
  activity_sources:
    github:
      attribution_pipeline: cogni-v0.0
      source_refs: ["cogni-dao/poly"]

payments:
  status: pending_activation

# Born-reviewable default gates. When this node is minted as a single-node fork
# (node-at-root, no `nodes:` registry) the operator's review path runs these gates
# against the repo-root `.cogni/rules/` below. The mint (`renderRepoSpec`) re-emits
# this same block onto the minted repo's identity spec — keep the two in lockstep.
# Gate set coordinated with the operator review path (Lane A). Tune per node.
gates:
  - type: review-limits
    id: review_limits
    with:
      max_changed_files: 50
      max_total_diff_kb: 1500
  - type: ai-rule
    with:
      rule_file: pr-syntropy-coherence.yaml
  - type: ai-rule
    with:
      rule_file: patterns-and-docs.yaml
  - type: ai-rule
    with:
      rule_file: repo-goal-alignment.yaml

# Akash lane (story.5016). Declares WHAT this node runs so the operator can
# render a provider-neutral workload. Emitted verbatim by
# `renderNodeDeploymentYaml()` in @cogni/repo-spec -- the SAME renderer the node
# scaffolder mints from and that `assertDeclaredNodeDeployment` prints when a
# node is missing one. One renderer, no hand-authored drift.
deployment:
  services:
    - name: app
      artifact:
        name: app
        context: .
        dockerfile: Dockerfile
        target: runner
      port: 3200
      visibility: public
      runtime_profile: cogni-node-app-v1
      bindings: {}
      secret_refs:
        - key: AUTH_SECRET
        - key: DATABASE_URL
        - key: DATABASE_SERVICE_URL
        - key: LITELLM_VIRTUAL_KEY
        - key: SCHEDULER_API_TOKEN
        - key: BILLING_INGEST_TOKEN
      bind_host: 0.0.0.0
      resources:
        cpu_units: 2
        memory_mi: 2048
        storage_mi: 4096
