# Activity ledger ingestion + approver allowlist.
# `approvers` gates the `(admin)/` route group and write routes under
# `/api/v1/attribution/*`. Replace with the fork's DAO-owner wallet(s) when
# spinning up a new node from this template.
activity_ledger:
  epoch_length_days: 7
  approvers:
    - "0x070075F1389Ae1182aBac722B36CA12285d0c949" # derekg1729.eth (template default)
  activity_sources:
    github:
      attribution_pipeline: cogni-v0.0
      source_refs: ["cogni-dao/poly"]

payments:
  status: pending_activation

# Born-reviewable default gates. When this node is minted as a single-node fork
# (node-at-root, no `nodes:` registry) the operator's review path runs these gates
# against the repo-root `.cogni/rules/` below. The mint (`renderRepoSpec`) re-emits
# this same block onto the minted repo's identity spec — keep the two in lockstep.
# Gate set coordinated with the operator review path (Lane A). Tune per node.
gates:
  - type: review-limits
    id: review_limits
    with:
      max_changed_files: 50
      max_total_diff_kb: 1500
  - type: ai-rule
    with:
      rule_file: pr-syntropy-coherence.yaml
  - type: ai-rule
    with:
      rule_file: patterns-and-docs.yaml
  - type: ai-rule
    with:
      rule_file: repo-goal-alignment.yaml

# Akash lane (story.5016). Declares WHAT this node runs so the operator can
# render a provider-neutral workload. Emitted verbatim by
# `renderNodeDeploymentYaml()` in @cogni/repo-spec -- the SAME renderer the node
# scaffolder mints from and that `assertDeclaredNodeDeployment` prints when a
# node is missing one. One renderer, no hand-authored drift.
deployment:
  services:
    - name: app
      artifact:
        name: app
        context: .
        dockerfile: Dockerfile
        target: runner
      port: 3200
      visibility: public
      runtime_profile: cogni-node-app-v1
      bindings:
        # Operator resolves this to the paper-trader sidecar's URL. The app only
        # ROUTES to it when PAPER_ENFORCE_MODE=paper (set per-env, candidate/
        # preview only); the live builder ignores it, so prod stays live-CLOB.
        PAPER_SIDECAR_URL: paper-trader
      # Node-owned secret env the akash lease must map into the app container.
      # The runtime_profile injects the A1 baseline (AUTH_SECRET, DATABASE_URL,
      # EVM_RPC_URL, …) automatically — those are NOT listed here (operator #40
      # pruned them; listing profile keys is redundant). These are the A2 node
      # secrets the profile does NOT know about: the per-tenant Polymarket
      # trading-wallet creds + the paper-mode switch. Values are written per-env
      # via self-serve `POST /nodes/{id}/secrets`; each key resolves from this
      # node's OpenBao bank (`cogni/<env>/poly/<KEY>`). PAPER_ENFORCE_MODE is the
      # domino: without it in the pod, `getPolyTraderWalletAdapter` throws, the
      # executor factory is undefined, and no mirror poll runs (bug.5253).
      # NOTE (BRANCH_HEAD_IS_LEASE): akash leases redeploy only when the
      # deploy/<env>-<node> branch head moves. After writing new secret VALUES,
      # a fresh source SHA is required to force ArgoCD to redeploy the lease so
      # the pod re-reads the ESO-synced secret — a same-SHA re-flight is a no-op.
      secret_refs:
        - key: PAPER_ENFORCE_MODE
        - key: POLYGON_RPC_URL
        - key: PRIVY_USER_WALLETS_APP_ID
        - key: PRIVY_USER_WALLETS_APP_SECRET
        - key: PRIVY_USER_WALLETS_SIGNING_KEY
        - key: POLY_WALLET_AEAD_KEY_ID
        # Substrate-managed (source: agent, auto-generated in OpenBao — never
        # self-serve set; 403 key_reserved is correct). Declared here so the
        # operator projects it into the pod: without it the live-CLOB executor
        # throws WalletAdapterUnconfigured and no mirror poll runs. Required for
        # prod live trading (paper mode's stub covers its absence; live does not).
        - key: POLY_WALLET_AEAD_KEY_HEX
      bind_host: 0.0.0.0
      resources:
        cpu_units: 2
        memory_mi: 2048
        storage_mi: 4096
    # Paper-trading sidecar (as-built from cogni-poly). FastAPI wrapper over the
    # vendored polymarket-paper-trader; the app's buildPaperOnlyExecutor talks to
    # it over PAPER_SIDECAR_URL. Private (loopback-tier); no runtime_profile (not
    # a cogni-node-app). Gated to the paper-trading envs via `envs` (story.5043):
    # production runs live-CLOB (PAPER_ENFORCE_MODE=live) and never routes to the
    # sidecar, so excluding it keeps prod a 1-service akash lease that ships
    # in-place — no lease re-mint (prod is the activity_env and cannot re-mint).
    - name: paper-trader
      artifact:
        name: paper-trader
        context: sidecars/paper-trader
        # dockerfile is repo-root-relative (like the app's); COPY paths inside it
        # resolve against `context`. Build the `base` runtime stage, not `test`.
        dockerfile: sidecars/paper-trader/Dockerfile
        target: base
      port: 9100
      visibility: private
      # story.5043 per-service env gate: deploy the sidecar ONLY where paper mode
      # runs. Absent = every env; listing these two excludes production.
      envs: [candidate-a, preview]
      bindings: {}
      secret_refs: []
      bind_host: 0.0.0.0
      resources:
        cpu_units: 0.5
        memory_mi: 384
        storage_mi: 1024
