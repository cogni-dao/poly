"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "pnpm conductor:setup"
run_mode = "concurrent"

[scripts.run.local]
available_in = [ "local" ]
command = "pnpm dev:local"
default = true
icon = "play"

[scripts.run.health]
available_in = [ "local" ]
command = "pnpm dev:local:health"
icon = "heart-pulse"
